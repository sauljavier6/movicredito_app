name: movicredito_app
description: Aplicacion movil de clientes MoviCredito.
publish_to: "none"
version: 0.1.0+1
environment:
  sdk: ">=3.5.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  url_launcher: ^6.3.1
  socket_io_client: ^3.1.2
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true

# Coloca los 3 PNG de movicredito_iconos_android.zip en assets/icon/.
# Luego ejecuta scripts/setup_launcher_icon.cmd para generar los iconos Android.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/launcher_icon.png"
  adaptive_icon_background: "assets/icon/adaptive_background.png"
  adaptive_icon_foreground: "assets/icon/adaptive_foreground.png"
  adaptive_icon_foreground_inset: 0
